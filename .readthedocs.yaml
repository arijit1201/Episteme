# Read the Docs build. Connect the repo at readthedocs.org when you want hosting; CI does not need this file.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install zensical==0.0.73
    - zensical build --clean --strict
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -r site/. $READTHEDOCS_OUTPUT/html/
