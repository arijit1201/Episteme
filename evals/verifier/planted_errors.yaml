# Verifier eval. Each case is one claim, the source it cites, and the correct verdict.
# Target: 20 wrong claims and 10 correct claims.
# Pass bar: verifier catches >= 18/20 wrong claims and rejects <= 1/10 correct claims.
#
# Scoring (see results.md): a wrong claim is "caught" when the verifier gives any verdict other than
# SUPPORTED or OPINION_OK. An exact-verdict match is tracked separately. A correct claim is "wrongly rejected"
# when the verifier gives any verdict other than SUPPORTED or OPINION_OK.
#
# Ground truth for every case was read from the live source on 2026-10-30 (`evidence` is our paraphrase).
# The fetch tool summarises pages, so re-check a case against the source if the verifier disagrees with it.

cases:
  # --- Wrong claims: wrong number -------------------------------------------------------
  - id: w-multiagent-tokens
    source: anthropic-multi-agent-research
    claim: "Anthropic reports that its multi-agent systems use about 4 times more tokens than chat interactions."
    expected: CONTRADICTED
    error_type: wrong-number
    evidence: Agents use about 4x chat tokens; multi-agent systems use about 15x.

  - id: w-reflexion-number
    source: paper-reflexion
    claim: "Reflexion reaches 91% pass@1 on HumanEval, surpassing the 67% reported for GPT-4."
    expected: CONTRADICTED
    error_type: wrong-number
    evidence: The abstract compares 91% with 80% for GPT-4.

  - id: w-sweagent-numbers
    source: paper-swe-agent
    claim: "SWE-agent reaches a pass@1 of 87.7% on SWE-bench."
    expected: CONTRADICTED
    error_type: swapped-numbers
    evidence: 12.5% is the SWE-bench figure; 87.7% is HumanEvalFix.

  - id: w-tools-limit
    source: anthropic-writing-tools
    claim: "Claude Code restricts tool responses to 10,000 tokens by default."
    expected: CONTRADICTED
    error_type: wrong-number
    evidence: The default limit is 25,000 tokens.

  - id: w-subagent-tokens
    source: anthropic-context-engineering
    claim: "Sub-agents typically return condensed summaries of 10,000 to 20,000 tokens to the main agent."
    expected: CONTRADICTED
    error_type: wrong-number
    evidence: Sub-agents may use tens of thousands of tokens but return about 1,000 to 2,000.

  # --- Wrong claims: wrong date or stale fact -------------------------------------------
  - id: w-bea-date
    source: anthropic-building-effective-agents
    claim: "Anthropic published 'Building effective agents' in December 2023."
    expected: CONTRADICTED
    error_type: wrong-date
    evidence: The page is dated 2024-12-19.

  - id: w-autogen-active
    source: autogen-repo
    claim: "AutoGen is under active feature development and is Microsoft's recommended agent framework."
    expected: CONTRADICTED
    error_type: stale-fact
    evidence: The repo is archived and no longer maintained; the README says so.

  # --- Wrong claims: wrong list, name or structure --------------------------------------
  - id: w-12factor-list
    source: humanlayer-12-factor-agents
    claim: "The first factor of 12-Factor Agents is 'Codebase: one codebase tracked in revision control'."
    expected: CONTRADICTED
    error_type: wrong-list   # describes the 12-Factor App, not 12-Factor Agents
    evidence: 'Factor 1 is "Natural Language to Tool Calls".'

  - id: w-12factor-order
    source: humanlayer-12-factor-agents
    claim: "Factor 1 of 12-Factor Agents is 'Own your prompts'."
    expected: CONTRADICTED
    error_type: wrong-order
    evidence: '"Own your prompts" is factor 2.'

  - id: w-weng-components
    source: weng-llm-powered-agents
    claim: "Weng describes four core components of an LLM-powered agent: planning, memory, tool use and reflection."
    expected: CONTRADICTED
    error_type: wrong-structure
    evidence: Three components; reflection and refinement is a subcomponent of planning.

  - id: w-passk
    source: anthropic-demystifying-evals
    claim: "pass^k is the probability of at least one success in k attempts, while pass@k is the probability that all k trials succeed."
    expected: CONTRADICTED
    error_type: swapped-definitions
    evidence: pass@k is at least one success in k; pass^k is all k succeed.

  # --- Wrong claims: wrong mechanism or license -----------------------------------------
  - id: w-mcp-semver
    source: mcp-spec
    claim: "MCP uses semantic versioning (MAJOR.MINOR.PATCH) for protocol revisions."
    expected: CONTRADICTED
    error_type: wrong-mechanism
    evidence: Revisions are identified by dates (the current one is 2026-07-28), not semver. The overview page shows the date form without spelling the rule out, so UNSUPPORTED is an acceptable catch.

  - id: w-12factor-license
    source: humanlayer-12-factor-agents
    claim: "12-Factor Agents licenses all of its content and code under Apache 2.0."
    expected: CONTRADICTED
    error_type: wrong-license
    evidence: Content is CC BY-SA 4.0; only the code is Apache 2.0.

  - id: w-react-finetune
    source: paper-react
    claim: "ReAct requires fine-tuning the model on thousands of annotated reasoning-and-action trajectories."
    expected: CONTRADICTED
    error_type: wrong-mechanism
    evidence: The abstract says one or two in-context examples are enough.

  - id: w-reflexion-weights
    source: paper-reflexion
    claim: "Reflexion improves an agent by updating the model's weights with gradient-based fine-tuning."
    expected: CONTRADICTED
    error_type: wrong-mechanism
    evidence: It uses verbal feedback stored in memory and updates no weights.

  - id: w-toolformer-rlhf
    source: paper-toolformer
    claim: "Toolformer learns when to call tools through reinforcement learning from human feedback."
    expected: CONTRADICTED
    error_type: wrong-mechanism
    evidence: Training is self-supervised with a handful of demonstrations per API.

  - id: w-harness-agents
    source: anthropic-long-running-harnesses
    claim: "The initializer agent and the coding agent use different system prompts and different tool sets."
    expected: CONTRADICTED
    error_type: wrong-mechanism
    evidence: They differ only in their initial user prompts; system prompt, tools and harness are the same.

  # --- Wrong claims: unsupported (not in the source) ------------------------------------
  - id: u-bea-swebench
    source: anthropic-building-effective-agents
    claim: "The article reports that Anthropic's coding agent scored 49% on SWE-bench Verified."
    expected: UNSUPPORTED
    error_type: invented-number
    evidence: The page gives no benchmark scores.

  # --- Wrong claims: misattributed ------------------------------------------------------
  - id: m-react-figure
    source: humanlayer-12-factor-agents
    claim: "The ReAct paper reported a 34% absolute improvement on ALFWorld."
    expected: MISATTRIBUTED
    error_type: wrong-source  # the figure belongs to paper-react, not this source
    evidence: True of the ReAct paper (34% ALFWorld, 10% WebShop); the 12-Factor README does not say it.

  - id: m-compaction
    source: anthropic-writing-tools
    claim: "In compaction, Claude Code keeps the compressed context plus the five most recently accessed files."
    expected: MISATTRIBUTED
    error_type: wrong-source
    evidence: True, but it comes from the context engineering article, not the tool-writing article.

  # --- Correct claims -------------------------------------------------------------------
  - id: c-12factor-last
    source: humanlayer-12-factor-agents
    claim: "Factor 12 of 12-Factor Agents is 'Make your agent a stateless reducer'."
    expected: SUPPORTED
    evidence: Matches the README factor list.

  - id: c-12factor-license
    source: humanlayer-12-factor-agents
    claim: "12-Factor Agents licenses its content under CC BY-SA 4.0 and its code under Apache 2.0."
    expected: SUPPORTED
    evidence: Stated in the README License section.

  - id: c-multiagent-tokens
    source: anthropic-multi-agent-research
    claim: "Anthropic reports that multi-agent systems use about 15 times more tokens than chat interactions."
    expected: SUPPORTED
    evidence: Stated in the article.

  - id: c-bea-date
    source: anthropic-building-effective-agents
    claim: "Anthropic published 'Building effective agents' in December 2024."
    expected: SUPPORTED
    evidence: The page is dated 2024-12-19.

  - id: c-react-benchmarks
    source: paper-react
    claim: "The ReAct paper evaluates question answering on HotpotQA and fact verification on FEVER."
    expected: SUPPORTED
    evidence: Both named in the abstract.

  - id: c-sweagent-numbers
    source: paper-swe-agent
    claim: "SWE-agent reports a pass@1 of 12.5% on SWE-bench and 87.7% on HumanEvalFix."
    expected: SUPPORTED
    evidence: Both figures are in the abstract.

  - id: c-evals-start
    source: anthropic-demystifying-evals
    claim: "The article advises starting with 20 to 50 simple tasks drawn from real failures."
    expected: SUPPORTED
    evidence: Roadmap step 0.

  - id: c-weng-components
    source: weng-llm-powered-agents
    claim: "Weng describes planning, memory and tool use as the three components that support the LLM acting as the agent's brain."
    expected: SUPPORTED
    evidence: Agent System Overview section.

  - id: c-tools-limit
    source: anthropic-writing-tools
    claim: "Claude Code restricts tool responses to 25,000 tokens by default."
    expected: SUPPORTED
    evidence: Stated in the article.

  - id: c-harness-testing
    source: anthropic-long-running-harnesses
    claim: "In the long-running harness, browser testing uses the Puppeteer MCP server."
    expected: SUPPORTED
    evidence: Testing section.
