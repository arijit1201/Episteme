[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Provider-neutral model adapter shared by all starters."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
anthropic = ["anthropic==2.3.0"]
openai = ["openai==3.41.0"]

[tool.setuptools]
packages = ["agentkit", "agentkit.providers"]
