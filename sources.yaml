# Source registry. Every page cites sources by `id`.
#
# Fields
#   id            unique, kebab-case
#   title         document title
#   url           canonical URL
#   publisher     who published it
#   kind          blog | guide | docs | course | book | paper | spec | repo
#   tier          primary (original author or official docs) | secondary (summary or commentary)
#   license       all-rights-reserved | cc-by-sa-4.0 | apache-2.0 | mit | arxiv-default | unknown
#   published     YYYY-MM-DD, YYYY-MM or null
#   status        unverified | verified | dead
#   last_verified YYYY-MM-DD or null (date a human or the ingest run confirmed the URL serves this document)
#   content_hash  sha256 of the fetched text, or null. Set by the ingest run; used to detect changes.
#   notes         optional
#
# Phase 1 task: visit every URL marked `unverified`, fix it if wrong, then set status and last_verified.

